AWSTemplateFormatVersion: 2010-09-09
Description: The AWS CloudFormation template for this Serverless application
Parameters:
    AppName:
        Type: String
        Default: "dx-aws-pipeline-badges"
    EnvironmentName:
        Type: String
        Default: "non-prod"
        Description: "Deployment environment name (non-prod, prod)"
Resources:
    CloudFrontOAC:
        Type: AWS::CloudFront::OriginAccessControl
        Properties:
            OriginAccessControlConfig:
                Description: "OAC for badges bucket"
                Name: !Sub "${AppName}-oac"
                OriginAccessControlOriginType: s3
                SigningBehavior: always
                SigningProtocol: sigv4

    BadgesCloudFrontDistribution:
        Type: AWS::CloudFront::Distribution
        Properties:
            DistributionConfig:
                Comment: !Sub "CloudFront distribution for ${AppName} badges"
                Enabled: true
                DefaultCacheBehavior:
                    TargetOriginId: S3Origin
                    ViewerProtocolPolicy: redirect-to-https
                    AllowedMethods:
                        - GET
                        - HEAD
                        - OPTIONS
                    CachedMethods:
                        - GET
                        - HEAD
                        - OPTIONS
                    CachePolicyId: !Ref BadgeCachePolicy
                    OriginRequestPolicyId: !Ref BadgeOriginRequestPolicy
                    ResponseHeadersPolicyId: !Ref BadgeResponseHeadersPolicy
                Origins:
                    - Id: S3Origin
                      DomainName: !GetAtt BuildBadgesImagesBucket.RegionalDomainName
                      S3OriginConfig: {}
                      OriginAccessControlId: !GetAtt CloudFrontOAC.Id
                ViewerCertificate:
                    CloudFrontDefaultCertificate: true

    # CloudFront Policies
    BadgeCachePolicy:
        Type: AWS::CloudFront::CachePolicy
        Properties:
            CachePolicyConfig:
                Name: !Sub "${AppName}-cache-policy"
                Comment: "Disable caching for real-time build badges"
                DefaultTTL: 0
                MaxTTL: 0
                MinTTL: 0
                ParametersInCacheKeyAndForwardedToOrigin:
                    CookiesConfig:
                        CookieBehavior: none
                    HeadersConfig:
                        HeaderBehavior: none
                    QueryStringsConfig:
                        QueryStringBehavior: none
                    EnableAcceptEncodingBrotli: false
                    EnableAcceptEncodingGzip: false

    BadgeOriginRequestPolicy:
        Type: AWS::CloudFront::OriginRequestPolicy
        Properties:
            OriginRequestPolicyConfig:
                Name: !Sub "${AppName}-origin-request-policy"
                Comment: "Pass CORS headers to S3 origin"
                CookiesConfig:
                    CookieBehavior: none
                HeadersConfig:
                    HeaderBehavior: whitelist
                    Headers:
                        - Origin
                        - Access-Control-Request-Method
                        - Access-Control-Request-Headers
                QueryStringsConfig:
                    QueryStringBehavior: none

    BadgeResponseHeadersPolicy:
        Type: AWS::CloudFront::ResponseHeadersPolicy
        Properties:
            ResponseHeadersPolicyConfig:
                Name: !Sub "${AppName}-response-policy"
                Comment: "CORS and Security headers for badges"
                CorsConfig:
                    AccessControlAllowCredentials: false
                    AccessControlAllowHeaders:
                        Items:
                            - "*"
                    AccessControlAllowMethods:
                        Items:
                            - GET
                            - OPTIONS
                    AccessControlAllowOrigins:
                        Items:
                            - "*"
                    OriginOverride: true
                SecurityHeadersConfig:
                    FrameOptions:
                        FrameOption: DENY
                        Override: true
                    ContentTypeOptions:
                        Override: true
                    XSSProtection:
                        Protection: true
                        ModeBlock: true
                        Override: true

    # Roles
    IamRoleLambdaExecution:
        Type: "AWS::IAM::Role"
        Properties:
            AssumeRolePolicyDocument:
                Version: 2012-10-17
                Statement:
                    - Effect: Allow
                      Principal:
                          Service:
                              - lambda.amazonaws.com
                      Action:
                          - "sts:AssumeRole"
            Policies:
                - PolicyName: !Sub "${AppName}-lambda-policy"
                  PolicyDocument:
                      Version: 2012-10-17
                      Statement:
                          - Effect: Allow
                            Action:
                                - "logs:CreateLogStream"
                            Resource:
                                - !Sub >-
                                    arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}*:*
                          - Effect: Allow
                            Action:
                                - "logs:PutLogEvents"
                            Resource:
                                - !Sub >-
                                    arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}*:*:*
                          - Effect: Allow
                            Action:
                                - "s3:PutObject"
                            Resource: !Sub "arn:aws:s3:::${AppName}-images/*"
                          - Effect: Allow
                            Action:
                                - "codepipeline:GetPipelineExecution"
                                - "codepipeline:ListActionExecutions"
                                - "codepipeline:GetPipeline"
                            Resource:
                                - "*"
            Path: /
            RoleName: !Sub "${AppName}-lambda-role"

    # Functions
    BadgeFunction:
        Type: "AWS::Lambda::Function"
        Properties:
            FunctionName: !Sub "${AppName}-engine"
            Description: Unified engine for status, commit, and author badges
            Handler: index.handler
            Runtime: nodejs20.x
            MemorySize: 256
            Timeout: 15
            Role: !GetAtt IamRoleLambdaExecution.Arn
            Environment:
                Variables:
                    BUCKET_BADGES: !Sub "${AppName}-images"
            Code:
                ZipFile: |
                    const { S3Client, PutObjectCommand } = require('@aws-sdk/client-s3');
                    const { CodePipelineClient, GetPipelineExecutionCommand, ListActionExecutionsCommand, GetPipelineCommand } = require('@aws-sdk/client-codepipeline');
                    const https = require('https');
                    const s3 = new S3Client({});
                    const cp = new CodePipelineClient({});
                    const purgeCamoCache = async (pName) => {
                        try {
                            const pDef = await cp.send(new GetPipelineCommand({ name: pName }));
                            const sourceStage = pDef.pipeline.stages.find(s => s.name === 'Source' || s.actions.some(a => a.actionTypeId.category === 'Source'));
                            const sourceAction = sourceStage?.actions.find(a => a.actionTypeId.category === 'Source');
                            if (!sourceAction) return;
                            
                            const config = sourceAction.configuration || {};
                            const repoId = config.FullRepositoryId || (config.Owner && config.Repo ? `${config.Owner}/${config.Repo}` : null);
                            if (!repoId) return;

                            const repoUrl = `https://github.com/${repoId}`;
                            const html = await new Promise((resolve, reject) => {
                                https.get(repoUrl, (res) => {
                                    let data = '';
                                    res.on('data', chunk => data += chunk);
                                    res.on('end', () => resolve(data));
                                }).on('error', reject);
                            });
                            
                            const camoRegex = /https:\/\/camo\.githubusercontent\.com\/[a-zA-Z0-9.\/?=_%:-]+/g;
                            const uniqueUrls = [...new Set(html.match(camoRegex) || [])];
                            console.log(`Auto-discovered ${repoId}. Purging ${uniqueUrls.length} Camo URLs.`);
                            
                            for (const url of uniqueUrls) {
                                await new Promise((resolve) => {
                                    const req = https.request(url, { method: 'PURGE' }, () => resolve());
                                    req.on('error', () => resolve());
                                    req.end();
                                });
                            }
                        } catch (e) { console.error('Auto-discovery/Purge Error:', e); }
                    };
                    const svg = (l, v, c) => {
                      const lw = l.length * 8 + 14, vw = v.length * 7 + 14, tw = lw + vw;
                      let bg = `<rect x="${lw}" width="${vw}" height="20" fill="${c}"/>`;
                      if (v === 'in progress' || v === 'in_progress' || v === 'started') {
                        const c1 = '#dfb317', c2 = '#f8cd40';
                        const p = `<pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect x="0" width="14" height="28" fill="${c1}"><animate attributeName="x" from="0" to="28" dur="1s" repeatCount="indefinite"/></rect><rect x="14" width="14" height="28" fill="${c2}"><animate attributeName="x" from="14" to="42" dur="1s" repeatCount="indefinite"/></rect><rect x="-14" width="14" height="28" fill="${c2}"><animate attributeName="x" from="-14" to="14" dur="1s" repeatCount="indefinite"/></rect></pattern>`;
                        bg = `<defs>${p}</defs><rect x="${lw}" width="${vw}" height="20" fill="url(#p)"/>`;
                      }
                      return `<svg xmlns="http://www.w3.org/2000/svg" width="${tw}" height="20" role="img" aria-label="${l}: ${v}"><linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="r"><rect width="${tw}" height="20" rx="3" fill="#fff"/></clipPath><g clip-path="url(#r)"><rect width="${lw}" height="20" fill="#555"/>${bg}<rect width="${tw}" height="20" fill="url(#s)"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110"><text x="${lw*5}" y="140" transform="scale(.1)" fill="#fff" textLength="${l.length*70}">${l}</text><text x="${(lw+vw/2)*10}" y="140" transform="scale(.1)" fill="#fff" textLength="${v.length*65}">${v}</text></g></svg>`;
                    };
                    exports.handler = async (e) => {
                      const d = e.detail, type = e['detail-type'];
                      const p = d.pipeline || d['project-name'];
                      const s = d.stage ? `-${d.stage}` : "";
                      const st = (d.state || d['build-status'] || 'UNKNOWN').toUpperCase();
                      
                      const isBuild = type.includes('Build');
                      const isPipeline = type.includes('Pipeline');
                      const isStage = type.includes('Stage');
                      
                      // 1. Update Status Badge
                      // We only process Build, Pipeline, and Stage events. 
                      // We IGNORE 'Action' events for the status badges to prevent race conditions (especially in Source stage).
                      if (isBuild || isPipeline || isStage) {
                        const c = st === 'SUCCEEDED' ? '#4c1' : (['FAILED','STOPPED','ERROR'].includes(st) ? '#e05d44' : (['STARTED','IN_PROGRESS','RESUMED'].includes(st) ? '#dfb317' : '#979797'));
                        const label = d.pipeline ? (d.stage ? d.stage.toLowerCase() : 'pipeline') : 'build';
                        
                        await s3.send(new PutObjectCommand({ 
                          Bucket: process.env.BUCKET_BADGES, 
                          Key: `${p}/${p}${s}.svg`, 
                          Body: svg(label, st.toLowerCase().replace(/_/g, ' '), c), 
                          ContentType: 'image/svg+xml', 
                          CacheControl: 'no-cache, no-store' 
                        }));
                      }

                      // 2. Update Metadata (Commit/Author/Time)
                      // Only update metadata on Pipeline or Build completion/start to save API calls
                      if (d.pipeline && d['execution-id'] && (isPipeline || isStage)) {
                        try {
                          const ex = await cp.send(new GetPipelineExecutionCommand({ pipelineName: p, pipelineExecutionId: d['execution-id'] }));
                          const ac = await cp.send(new ListActionExecutionsCommand({ pipelineName: p, filter: { pipelineExecutionId: d['execution-id'] } }));
                          
                          let a = 'System', cid = 'N/A', t = new Date().toISOString().replace('T', ' ').split('.')[0];
                          
                          if (ex.pipelineExecution?.artifactRevisions?.length > 0) {
                            const r = ex.pipelineExecution.artifactRevisions[0];
                            cid = r.revisionId?.substring(0, 8) || 'N/A';
                            try {
                                const sm = r.revisionSummary ? JSON.parse(r.revisionSummary) : {};
                                a = sm.AuthorName || sm.author || a;
                            } catch(e) {}
                          }
                          
                          const actionList = ac.actionExecutionDetails || [];
                          const src = actionList.find(x => x.stageName === 'Source' || x.actionName === 'Source');
                          if (src?.output) {
                            const v = src.output.outputVariables || src.output.executionVariables || {};
                            a = v.AuthorDisplayName || v.AuthorName || v.AuthorId || a;
                          }

                          const common = { Bucket: process.env.BUCKET_BADGES, ContentType: 'image/svg+xml', CacheControl: 'no-cache, no-store' };
                          await Promise.all([
                            s3.send(new PutObjectCommand({ ...common, Key: `${p}/${p}${s}-commitId.svg`, Body: svg('commit', cid, '#9f9f9f') })),
                            s3.send(new PutObjectCommand({ ...common, Key: `${p}/${p}${s}-timestamp.svg`, Body: svg('date', t, '#007ec6') })),
                            s3.send(new PutObjectCommand({ ...common, Key: `${p}/${p}${s}-author.svg`, Body: svg('author', a, '#fe7d37') }))
                          ]);
                        } catch (err) { console.error('Metadata error:', err); }
                      }
                      
                      await purgeCamoCache(p);
                      return 'Success';
                    };

    # CloudWatch Events
    BadgeTriggerEventsRule:
        Type: "AWS::Events::Rule"
        Properties:
            EventPattern:
                source:
                    - aws.codebuild
                    - aws.codepipeline
                detail-type:
                    - CodeBuild Build State Change
                    - CodePipeline Pipeline Execution State Change
                    - CodePipeline Stage Execution State Change
                    - CodePipeline Action Execution State Change
            State: ENABLED
            Description: Unified trigger for CodeBuild and CodePipeline status changes
            Name: !Sub "${AppName}-unified-trigger"
            Targets:
                - Arn: !GetAtt BadgeFunction.Arn
                  Id: BadgeFunctionTarget
    BadgeFunctionPermission:
        Type: "AWS::Lambda::Permission"
        Properties:
            FunctionName: !GetAtt BadgeFunction.Arn
            Action: "lambda:InvokeFunction"
            Principal: events.amazonaws.com
            SourceArn: !GetAtt BadgeTriggerEventsRule.Arn
    # Images Bucket
    BuildBadgesImagesBucket:
        Type: "AWS::S3::Bucket"
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            BucketName: !Sub "${AppName}-images"
            OwnershipControls:
                Rules:
                    - ObjectOwnership: BucketOwnerEnforced
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true
            LoggingConfiguration:
                DestinationBucketName: !ImportValue
                    "Fn::Sub": "${EnvironmentName}-system-access-logs-storage-AccessLoggingS3Bucket"
                LogFilePrefix: "dx-aws-pipeline-badges-log/"
            CorsConfiguration:
                CorsRules:
                    - AllowedHeaders:
                          - "*"
                      AllowedMethods:
                          - GET
                          - HEAD
                      AllowedOrigins:
                          - "https://github.com"
                          - "https://www.github.com"
                      MaxAge: 90
            VersioningConfiguration:
                Status: Enabled
            LifecycleConfiguration:
                Rules:
                    - Id: GlacierRule
                      Prefix: glacier
                      Status: Enabled
                      ExpirationInDays: 730
                      Transitions:
                          - TransitionInDays: 365
                            StorageClass: GLACIER
                    - Id: delete-incomplete-mpu-7days
                      Status: Enabled
                      Prefix: ""
                      AbortIncompleteMultipartUpload:
                          DaysAfterInitiation: 7
    BuildBadgesImagesBucketPolicy:
        Type: "AWS::S3::BucketPolicy"
        Properties:
            PolicyDocument:
                Id: !Sub "${AppName}-bucket-policy"
                Version: 2012-10-17
                Statement:
                    - Sid: AllowCloudFrontServicePrincipal
                      Effect: Allow
                      Principal:
                          Service: cloudfront.amazonaws.com
                      Action: "s3:GetObject"
                      Resource: !Sub "arn:aws:s3:::${BuildBadgesImagesBucket}/*"
                      Condition:
                          StringEquals:
                              "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${BadgesCloudFrontDistribution}"
                    - Sid: AllowSSLRequestsOnly
                      Effect: Deny
                      Principal: "*"
                      Action: "s3:*"
                      Resource:
                          - !Sub "arn:aws:s3:::${BuildBadgesImagesBucket}"
                          - !Sub "arn:aws:s3:::${BuildBadgesImagesBucket}/*"
                      Condition:
                          Bool:
                              "aws:SecureTransport": false
            Bucket: !Ref BuildBadgesImagesBucket

Outputs:
    BuildBadgesImagesBucketName:
        Description: Name of the bucket containing generated images
        Value: !Ref BuildBadgesImagesBucket

    CloudFrontDomainName:
        Description: CloudFront URL for serving badges via CDN
        Value: !GetAtt BadgesCloudFrontDistribution.DomainName
