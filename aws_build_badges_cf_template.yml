AWSTemplateFormatVersion: 2010-09-09
Description: The AWS CloudFormation template for this Serverless application
Parameters:
    # No-op section removed
    AppName:
        Type: String
        Default: "dx-aws-pipeline-badges"
Resources:
    # Log Groups
    BadgeEngineLogGroup:
        Type: "AWS::Logs::LogGroup"
        Properties:
            LogGroupName: !Sub "/aws/lambda/${AppName}-engine"

    # Roles
    IamRoleLambdaExecution:
        Type: "AWS::IAM::Role"
        Properties:
            AssumeRolePolicyDocument:
                Version: 2012-10-17
                Statement:
                    - Effect: Allow
                      Principal:
                          Service:
                              - lambda.amazonaws.com
                      Action:
                          - "sts:AssumeRole"
            Policies:
                - PolicyName: !Sub "${AppName}-lambda-policy"
                  PolicyDocument:
                      Version: 2012-10-17
                      Statement:
                          - Effect: Allow
                            Action:
                                - "logs:CreateLogStream"
                            Resource:
                                - !Sub >-
                                    arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}*:*
                          - Effect: Allow
                            Action:
                                - "logs:PutLogEvents"
                            Resource:
                                - !Sub >-
                                    arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}*:*:*
                          - Effect: Allow
                            Action:
                                - "s3:PutObject"
                                - "s3:PutObjectAcl"
                            Resource: !Sub "arn:aws:s3:::${AppName}-images/*"
                          - Effect: Allow
                            Action:
                                - "codepipeline:GetPipelineExecution"
                                - "codepipeline:ListActionExecutions"
                            Resource:
                                - "*"
            Path: /
            RoleName: !Sub "${AppName}-lambda-role"

    # Functions
    BadgeFunction:
        Type: "AWS::Lambda::Function"
        Properties:
            FunctionName: !Sub "${AppName}-engine"
            Description: Unified engine for status, commit, and author badges
            Handler: index.handler
            Runtime: nodejs20.x
            MemorySize: 256
            Timeout: 15
            Role: !GetAtt IamRoleLambdaExecution.Arn
            Environment:
                Variables:
                    BUCKET_BADGES: !Sub "${AppName}-images"
            Code:
                ZipFile: |
                    const { S3Client, PutObjectCommand } = require('@aws-sdk/client-s3');
                    const { CodePipelineClient, GetPipelineExecutionCommand, ListActionExecutionsCommand } = require('@aws-sdk/client-codepipeline');
                    const s3 = new S3Client({});
                    const cp = new CodePipelineClient({});
                    const svg = (l, v, c) => {
                      const lw = l.length * 8 + 14, vw = v.length * 7 + 14, tw = lw + vw;
                      return `<svg xmlns="http://www.w3.org/2000/svg" width="${tw}" height="20" role="img" aria-label="${l}: ${v}"><linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="r"><rect width="${tw}" height="20" rx="3" fill="#fff"/></clipPath><g clip-path="url(#r)"><rect width="${lw}" height="20" fill="#555"/><rect x="${lw}" width="${vw}" height="20" fill="${c}"/><rect width="${tw}" height="20" fill="url(#s)"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110"><text x="${lw*5}" y="140" transform="scale(.1)" fill="#fff" textLength="${l.length*70}">${l}</text><text x="${(lw+vw/2)*10}" y="140" transform="scale(.1)" fill="#fff" textLength="${v.length*65}">${v}</text></g></svg>`;
                    };
                    exports.handler = async (e) => {
                      console.log('Event:', JSON.stringify(e));
                      const d = e.detail, p = d.pipeline || d['project-name'], s = d.stage ? `-${d.stage}` : "", st = (d.state || d['build-status'] || 'UNKNOWN').toUpperCase();
                      const c = st === 'SUCCEEDED' ? '#4c1' : (['FAILED','STOPPED','ERROR'].includes(st) ? '#e05d44' : (['STARTED','IN_PROGRESS','RESUMED'].includes(st) ? '#dfb317' : '#979797'));
                      await s3.send(new PutObjectCommand({ Bucket: process.env.BUCKET_BADGES, Key: `${p}${s}.svg`, Body: svg(d.pipeline ? 'pipeline' : 'build', st.toLowerCase(), c), ContentType: 'image/svg+xml', CacheControl: 'no-cache, no-store' }));
                      if (d.pipeline && d['execution-id']) {
                        try {
                          const ex = await cp.send(new GetPipelineExecutionCommand({ pipelineName: p, pipelineExecutionId: d['execution-id'] }));
                          const ac = await cp.send(new ListActionExecutionsCommand({ pipelineName: p, filter: { pipelineExecutionId: d['execution-id'] } }));
                          let a = 'System', cid = 'N/A', t = new Date().toISOString().replace('T', ' ').split('.')[0];
                          if (ex.pipelineExecution && ex.pipelineExecution.artifactRevisions && ex.pipelineExecution.artifactRevisions.length > 0) {
                            const r = ex.pipelineExecution.artifactRevisions[0];
                            cid = r.revisionId?.substring(0, 8) || 'N/A';
                            const sm = r.revisionSummary ? JSON.parse(r.revisionSummary) : {};
                            a = sm.AuthorName || sm.author || a;
                          }
                          const actionList = ac.actionExecutionDetails || [];
                          const src = actionList.find(x => x.stageName === 'Source' || x.actionName === 'Source');
                          if (src && src.output) {
                            const v = src.output.outputVariables || src.output.executionVariables || {};
                            a = v.AuthorDisplayName || v.AuthorName || v.AuthorId || a;
                          }
                          const common = { Bucket: process.env.BUCKET_BADGES, ContentType: 'image/svg+xml', CacheControl: 'no-cache, no-store' };
                          await Promise.all([
                            s3.send(new PutObjectCommand({ ...common, Key: `${p}${s}-commitId.svg`, Body: svg('commit', cid, '#9f9f9f') })),
                            s3.send(new PutObjectCommand({ ...common, Key: `${p}${s}-timestamp.svg`, Body: svg('date', t, '#007ec6') })),
                            s3.send(new PutObjectCommand({ ...common, Key: `${p}${s}-author.svg`, Body: svg('author', a, '#fe7d37') }))
                          ]);
                        } catch (err) { console.error('Metadata error:', err); }
                      }
                      return 'Success';
                    };

    # CloudWatch Events
    StatusBadgeEventsRuleCloudWatchEvent1:
        Type: "AWS::Events::Rule"
        Properties:
            EventPattern:
                source:
                    - aws.codebuild
                detail-type:
                    - CodeBuild Build State Change
            State: ENABLED
            Description: Triggered upon status change of CodeBuild project
            Name: !Sub "${AppName}-status-build-event"
            Targets:
                - Arn: !GetAtt
                      - BadgeFunction
                      - Arn
                  Id: statusBadgeCloudWatchEvent
    StatusBadgeLambdaPermissionEventsRuleCloudWatchEvent1:
        Type: "AWS::Lambda::Permission"
        Properties:
            FunctionName: !GetAtt
                - BadgeFunction
                - Arn
            Action: "lambda:InvokeFunction"
            Principal: events.amazonaws.com
            SourceArn: !GetAtt
                - StatusBadgeEventsRuleCloudWatchEvent1
                - Arn
    StatusBadgeEventsRuleCloudWatchEvent2:
        Type: "AWS::Events::Rule"
        Properties:
            EventPattern:
                source:
                    - aws.codepipeline
                detail-type:
                    - CodePipeline Pipeline Execution State Change
                    - CodePipeline Stage Execution State Change
                    - CodePipeline Action Execution State Change
            State: ENABLED
            Description: Triggered upon status change of CodePipeline
            Name: !Sub "${AppName}-status-pipeline-event"
            Targets:
                - Arn: !GetAtt
                      - BadgeFunction
                      - Arn
                  Id: statusBadgeCloudWatchEvent
    StatusBadgeLambdaPermissionEventsRuleCloudWatchEvent2:
        Type: "AWS::Lambda::Permission"
        Properties:
            FunctionName: !GetAtt
                - BadgeFunction
                - Arn
            Action: "lambda:InvokeFunction"
            Principal: events.amazonaws.com
            SourceArn: !GetAtt
                - StatusBadgeEventsRuleCloudWatchEvent2
                - Arn
    CommitIdBadgeEventsRuleCloudWatchEvent1:
        Type: "AWS::Events::Rule"
        Properties:
            EventPattern:
                source:
                    - aws.codepipeline
                detail-type:
                    - CodePipeline Pipeline Execution State Change
                    - CodePipeline Stage Execution State Change
                    - CodePipeline Action Execution State Change
            State: ENABLED
            Description: Triggered upon status change of CodePipeline
            Name: !Sub "${AppName}-commit-id-pipeline-event"
            Targets:
                - Arn: !GetAtt
                      - BadgeFunction
                      - Arn
                  Id: commitIdBadgeCloudWatchEvent
    CommitIdBadgeLambdaPermissionEventsRuleCloudWatchEvent1:
        Type: "AWS::Lambda::Permission"
        Properties:
            FunctionName: !GetAtt
                - BadgeFunction
                - Arn
            Action: "lambda:InvokeFunction"
            Principal: events.amazonaws.com
            SourceArn: !GetAtt
                - CommitIdBadgeEventsRuleCloudWatchEvent1
                - Arn

    # Images Bucket
    BuildBadgesImagesBucket:
        Type: "AWS::S3::Bucket"
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            BucketName: !Sub "${AppName}-images"
            OwnershipControls:
                Rules:
                    - ObjectOwnership: BucketOwnerEnforced
            PublicAccessBlockConfiguration:
                BlockPublicAcls: false
                BlockPublicPolicy: false
                IgnorePublicAcls: false
                RestrictPublicBuckets: false
            WebsiteConfiguration:
                IndexDocument: index.html
            CorsConfiguration:
                CorsRules:
                    - AllowedHeaders:
                          - "*"
                      AllowedMethods:
                          - GET
                          - HEAD
                      AllowedOrigins:
                          - "https://github.com"
                          - "https://www.github.com"
                      MaxAge: 90
    BuildBadgesImagesBucketPolicy:
        Type: "AWS::S3::BucketPolicy"
        Properties:
            PolicyDocument:
                Id: !Sub "${AppName}-bucket-policy"
                Version: 2012-10-17
                Statement:
                    - Sid: PublicReadForGetBucketObjects
                      Effect: Allow
                      Principal: "*"
                      Action: "s3:GetObject"
                      Resource: !Sub "arn:aws:s3:::${BuildBadgesImagesBucket}/*"
            Bucket: !Ref BuildBadgesImagesBucket

Outputs:
    BuildBadgesImagesBucketName:
        Description: Name of the bucket containing generated images
        Value: !Ref BuildBadgesImagesBucket
